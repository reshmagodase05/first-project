<!DOCTYPE html>
<html>
<head>
    <title>प्रवीण, मी तुझी मैत्रीण आहे की नाही??</title>

    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 150px;
            color: white;
        }

        h1 {
            font-size: 45px;
        }

        button {
            font-size: 20px;
            padding: 12px 30px;
            margin: 15px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        .yes {
            background-color: #4CAF50;
            color: white;
        }

        .no {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>

<body>

    <h1>💕प्रवीण, मी तुझी मैत्रीण आहे की नाही? 💕</h1>

    <button class="yes" onclick="yesClicked()">YES ❤️</button>
    <button class="No" onclick="noClicked()">NO 😜</button>

    <script>
        function yesClicked() {
            document.body.innerHTML =
                "<h1>💖 खरं  तू माझ्यासाठी दलींदर  आहेस.! 💖</h1><p>🥰❤️ KAISA LAGA MERA MAJAK! ❤️🥰</p>";
        }

        function noClicked() {
            document.body.innerHTML =
                "<h1>😜 गू खा तू. ! 😂</h1><p>MAR TU KUTRYA! ❤️</p>";
        }
    </script>

</body>
</html>
